[project]
name = "nes-gym"
version = "0.1.0"
description = "Python dependency environment for the nes-rs Gymnasium/RL integration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cffi>=1.17,<2",
    "gymnasium>=1.0,<2",
    "numpy>=2.0,<3",
    "stable-baselines3>=2.4,<3",
    "torch>=2.13,<3",
]

[build-system]
requires = ["setuptools>=83,<86"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.uv]
package = true
override-dependencies = ["setuptools>=83,<86"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[tool.setuptools.packages.find]
where = ["src"]
