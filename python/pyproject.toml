[project]
name = "nes-gym"
version = "0.1.0"
description = "Python dependency environment for the nes-rs Gymnasium/RL integration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cffi>=1.17,<2",
    "gymnasium>=1.0,<2",
    "numpy>=2.0,<3",
    "stable-baselines3>=2.4,<3",
    "torch>=2.5,<3",
]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
