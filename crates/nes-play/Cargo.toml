[package]
name = "nes-play"
version = "0.1.0"
edition = "2021"

[features]
default = []
winit-frontend = ["dep:cpal", "dep:softbuffer", "dep:winit", "layered-render"]
tui-frontend = ["dep:crossterm", "layered-render"]
layered-render = ["nes-core/layered-render"]
diagnostic-capture = []

[dependencies]
nes-core = { path = "../nes-core" }
cpal = { version = "0.16.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }
crossterm = { version = "0.29.0", optional = true }

[[bin]]
name = "nes-winit"
path = "src/nes_winit.rs"
required-features = ["winit-frontend"]

[[bin]]
name = "nes-tui"
path = "src/nes_tui.rs"
required-features = ["tui-frontend"]
