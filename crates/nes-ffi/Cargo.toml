[package]
name = "nes-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The rewind tape is compiled into the shared library once. Python controls
# whether the Gym action is exposed at runtime.
nes-core = { path = "../nes-core", features = ["layered-render"] }
