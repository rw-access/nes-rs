[package]
name = "nes-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Training snapshots are explicit FFI-owned clones; the interactive rewind
# history is both unnecessary and undesirable for long RL rollouts.
nes-core = { path = "../nes-core", features = ["rewind-disabled"] }
