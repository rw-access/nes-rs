name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run workspace tests
        run: cargo test --workspace

  python:
    name: Python Gym tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install native FFI library
        run: cargo build --release -p nes-ffi

      - name: Sync locked Python environment
        run: uv sync --directory python --locked

      - name: Run Python unit tests
        run: uv run --directory python pytest -q
