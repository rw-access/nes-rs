<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nes-rs — 8-bit browser console</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="console" aria-label="NES-inspired television">
        <p id="status" class="sr-only" role="status">Choose an iNES ROM to begin.</p>
        <img class="tv-art" src="tv.svg" alt="">
        <section class="screen-wrap" aria-label="NES screen">
          <div class="screen-bezel">
            <canvas id="screen" width="256" height="240"></canvas>
          </div>
        </section>

        <div class="console-front">
          <div class="console-controls" aria-label="Television controls">
            <span class="power-cluster"><i class="power-led"></i><b>POWER</b></span>
            <span class="console-physical-button">RESET</span>
            <span class="console-physical-button">CHANNEL</span>
          </div>
          <span class="console-badge">Nintendo <small>COLOR TV</small></span>
        </div>

        <section class="utility-panel" aria-label="Emulator tools">
          <div class="utility-group primary-tools">
            <p class="panel-label">GAME DECK</p>
            <div class="button-row">
              <label class="file-button" for="rom-input">
                <span class="button-icon">↥</span> LOAD
                <input id="rom-input" type="file" accept=".nes,application/octet-stream">
              </label>
              <button id="audio-button" type="button">AUDIO</button>
            </div>
          </div>
          <div class="utility-group state-tools">
            <p class="panel-label">STATE MEMORY</p>
            <div class="button-row">
              <button id="snapshot-button" type="button" disabled>SAVE</button>
              <button id="restore-button" type="button" disabled>RESTORE</button>
              <button id="rewind-button" type="button" disabled>REWIND</button>
            </div>
          </div>
          <div class="utility-group record-tools">
            <p class="panel-label">PLAYBACK RECORDER</p>
            <div class="button-row">
              <button id="record-button" class="record-button" type="button" disabled><span class="record-dot">●</span> REC</button>
              <button id="stop-record-button" type="button" disabled>STOP</button>
            </div>
            <span id="recording-status" class="recording-status" role="status">Recording is off</span>
          </div>
          <a class="github-tray-link" href="https://github.com/rw-access/nes-rs" target="_blank" rel="noreferrer" aria-label="Open nes-rs on GitHub" title="Open nes-rs on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577l-.015-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.084-.729.084-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.604-2.665-.304-5.466-1.332-5.466-5.931 0-1.31.465-2.381 1.235-3.221-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.296-1.23 3.296-1.23.647 1.653.24 2.873.12 3.176.765.84 1.23 1.911 1.23 3.221 0 4.61-2.806 5.624-5.476 5.921.43.372.823 1.102.823 2.222l-.012 3.293c0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </a>
        </section>
      </section>

      <section class="control-deck" aria-label="Console controls and touch controls">
        <div class="deck-heading"><span>CONTROLLER 01</span><span>WIRED INPUT / READY</span></div>
        <div class="controller">
          <div class="controller-art">
            <!-- Controller vector source: https://commons.wikimedia.org/wiki/File:Nes_controller.svg -->
            <img src="controller.svg" alt="NES-inspired wired controller with a directional pad, Select and Start buttons, and red A and B buttons">
            <div class="controller-hitboxes" aria-label="Touch controls">
              <div class="dpad-hitbox" aria-label="Directional pad">
                <button class="hit-up" data-button="up" aria-label="Up"></button>
                <button class="hit-left" data-button="left" aria-label="Left"></button>
                <button class="hit-down" data-button="down" aria-label="Down"></button>
                <button class="hit-right" data-button="right" aria-label="Right"></button>
              </div>
              <div class="menu-hitbox">
                <button data-button="select" aria-label="Select"></button>
                <button data-button="start" aria-label="Start"></button>
              </div>
              <div class="face-hitbox">
                <button data-button="b" aria-label="B">B</button>
                <button data-button="a" aria-label="A">A</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="hint"><span class="hint-key">HOW TO PLAY</span> WASD / arrows move <i></i> J K or Z X fire <i></i> Shift + Enter select / start <i></i> R rewind <i></i> M mute <i></i> V cycle layers</footer>
    </main>
    <script type="module" src="app.js?v=20"></script>
  </body>
</html>
