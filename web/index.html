<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111217">
    <title>nes-rs — cardboard viewbox</title>
    <link rel="stylesheet" href="style.css?v=89">
  </head>
  <body>
    <main class="app-shell">
      <p id="status" class="sr-only" role="status">Choose an iNES ROM to begin.</p>

      <header class="toolbar" aria-label="Emulator toolbar">
        <div class="toolbar-primary">
          <label class="rom-picker" for="rom-input" title="Load a ROM">
            <span aria-hidden="true">＋</span><span>Load ROM</span>
            <input id="rom-input" type="file" accept=".nes,application/octet-stream">
          </label>
          <div class="toolbar-actions" aria-label="Playback and display">
            <button id="audio-button" type="button" aria-label="Enable audio" title="Enable audio">
              <span class="tool-label">Audio</span>
            </button>
            <button id="effects-button" type="button" aria-pressed="true" title="Toggle 2.5D effects">2.5D</button>
            <button id="effects-settings-button" type="button" aria-label="2.5D settings" title="2.5D settings" aria-expanded="false" aria-controls="effects-settings">Settings</button>
            <button id="motion-button" type="button" aria-pressed="false" aria-describedby="motion-status" title="Enable phone tilt">Tilt</button>
            <button id="motion-recenter-button" type="button" aria-label="Recenter view" title="Recenter view" hidden>Recenter</button>
          </div>
        </div>
        <div class="toolbar-secondary" aria-label="Save and recording">
          <button id="snapshot-button" type="button" title="Save state" disabled>Save</button>
          <button id="restore-button" type="button" title="Restore state" disabled>Restore</button>
          <button id="rewind-button" type="button" title="Rewind while held" disabled>Rewind</button>
          <button id="record-button" class="record-button" type="button" title="Start recording" disabled>Rec</button>
          <button id="stop-record-button" type="button" title="Stop recording and upload" disabled>Stop</button>
          <span id="recording-status" class="sr-only" role="status">Recording is off</span>
        </div>
      </header>

      <p id="motion-status" class="motion-status" role="status" aria-live="polite" hidden></p>

      <section class="game-panel" aria-label="Game screen">
        <div class="screen-wrap" data-rim="true">
          <div id="screen-stage" data-depth="false">
            <div id="screen-scene">
              <canvas id="screen" width="256" height="240" aria-label="Game screen"></canvas>
              <div id="depth-stack" aria-hidden="true">
                <canvas width="256" height="240"></canvas>
                <canvas width="256" height="240"></canvas>
                <canvas width="256" height="240"></canvas>
                <canvas width="256" height="240"></canvas>
              </div>
              <canvas id="depth-ghosts" width="256" height="240" aria-hidden="true"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="touch-controls" aria-label="Touch controls">
        <div class="controller-hitboxes">
          <div class="dpad-hitbox" aria-label="Directional pad">
            <button class="hit-up" data-button="up" aria-label="Up"><span aria-hidden="true">▲</span></button>
            <button class="hit-left" data-button="left" aria-label="Left"><span aria-hidden="true">◀</span></button>
            <button class="hit-down" data-button="down" aria-label="Down"><span aria-hidden="true">▼</span></button>
            <button class="hit-right" data-button="right" aria-label="Right"><span aria-hidden="true">▶</span></button>
          </div>
          <div class="menu-hitbox" aria-label="Menu buttons">
            <button data-button="select" aria-label="Select">Select</button>
            <button data-button="start" aria-label="Start">Start</button>
          </div>
          <div class="face-hitbox" aria-label="Action buttons">
            <button data-button="b" aria-label="B">B</button>
            <button data-button="a" aria-label="A">A</button>
          </div>
        </div>
      </section>

      <section id="effects-settings" class="presentation-panel" aria-label="2.5D settings" hidden>
        <div class="presentation-controls">
          <fieldset class="settings-group scene-group">
            <legend>Scene geometry</legend>
            <div class="group-controls">
              <label for="depth-input">
                <span>Background separation <output id="depth-value" for="depth-input">85 game px</output></span>
                <input id="depth-input" type="range" min="0" max="115" step="1" value="85" aria-describedby="depth-hint">
                <small id="depth-hint">Native NES pixels (256 × 240) · Zero restores a flat scene</small>
              </label>
              <label for="thickness-input">
                <span>Card thickness <output id="thickness-value" for="thickness-input">4 game px</output></span>
                <input id="thickness-input" type="range" min="0" max="8" step="1" value="4" aria-describedby="thickness-hint">
                <small id="thickness-hint">Native NES pixels · Independent of backdrop distance</small>
              </label>
              <label for="rim-width-input">
                <span>Rim width <output id="rim-width-value" for="rim-width-input">1%</output></span>
                <input id="rim-width-input" type="range" min="0" max="100" step="1" value="1" aria-describedby="rim-width-hint">
                <small id="rim-width-hint">Fraction of maximum frame width · Actual size shown in game pixels</small>
              </label>
              <label for="rim-thickness-input">
                <span>Rim thickness <output id="rim-thickness-value" for="rim-thickness-input">25% of foreground</output></span>
                <input id="rim-thickness-input" type="range" min="0" max="100" step="1" value="25" aria-describedby="rim-thickness-hint">
                <small id="rim-thickness-hint">Percentage of foreground thickness · Limited by available gap</small>
              </label>
              <label for="rim-recess-input">
                <span>Rim recess <output id="rim-recess-value" for="rim-recess-input">1% of gap</output></span>
                <input id="rim-recess-input" type="range" min="0" max="100" step="1" value="1" aria-describedby="rim-recess-hint">
                <small id="rim-recess-hint">Percentage of card gap · Zero is flush · Gameplay stays fixed</small>
              </label>
              <div class="surface-options">
                <label for="solid-sides-input"><input id="solid-sides-input" type="checkbox" checked>Solid sides</label>
                <label for="sprite-relief-input"><input id="sprite-relief-input" type="checkbox" checked aria-describedby="sprite-relief-hint">Layer relief</label>
                <label class="sprite-relief-style" for="sprite-relief-style">
                  <span>Relief style</span>
                  <select id="sprite-relief-style" aria-describedby="sprite-relief-hint">
                    <option value="shadows">Shadows only</option>
                    <option value="contact" selected>Thickness + shadows</option>
                    <option value="cutout">Forced cutouts + shadows</option>
                  </select>
                  <small id="sprite-relief-hint">Sprites and tiles · Faces stay aligned · Uses card thickness and shadow softness</small>
                </label>
                <label for="thin-overlaps-input"><input id="thin-overlaps-input" type="checkbox" checked aria-describedby="thin-overlaps-hint">Thin overlaps (⅓ thickness)</label>
                <small id="thin-overlaps-hint">Full thickness against the backdrop · Thin edges over other artwork</small>
                <label for="rim-input"><input id="rim-input" type="checkbox" checked>Rim</label>
                <label for="recessed-opening-input"><input id="recessed-opening-input" type="checkbox" aria-describedby="recessed-opening-hint">Recessed opening</label>
                <small id="recessed-opening-hint">Keep the inset opening when Rim is off</small>
                <label for="console-edge-input"><input id="console-edge-input" type="checkbox">Shell-colored edge</label>
              </div>
            </div>
          </fieldset>
          <fieldset class="settings-group viewing-group">
            <legend>Viewing setup</legend>
            <div class="group-controls">
              <label class="viewing-profile" for="motion-tracking-input">
                <span>View tracking</span>
                <select id="motion-tracking-input" aria-describedby="motion-tracking-hint">
                  <option value="look" selected>Look around — sideways peeking</option>
                  <option value="gravity">Ground stable — ignores room turns</option>
                </select>
                <small id="motion-tracking-hint">Look around follows gyro rotation · Recenter after turning your body · Changing modes recenters</small>
              </label>
              <label for="motion-strength-input">
                <span>Motion strength <output id="motion-strength-value" for="motion-strength-input">100%</output></span>
                <input id="motion-strength-input" type="range" min="0" max="100" step="1" value="100" disabled aria-describedby="motion-strength-hint">
                <small id="motion-strength-hint">50% follows measured tilt · 100% doubles the viewing response</small>
              </label>
              <label for="viewing-distance-input">
                <span>Viewing distance <output id="viewing-distance-value" for="viewing-distance-input">~35 cm</output></span>
                <input id="viewing-distance-input" type="range" min="20" max="100" step="1" value="35" aria-describedby="viewing-distance-hint">
                <small id="viewing-distance-hint">Estimated eyes-to-screen distance · Changes perspective and tilt together</small>
              </label>
              <label class="viewing-profile" for="screen-profile-input">
                <span>Screen size</span>
                <select id="screen-profile-input" aria-describedby="screen-profile-hint">
                  <option value="auto">Auto estimate</option>
                  <option value="phone">Phone</option>
                  <option value="large-phone">Large phone</option>
                  <option value="tablet-11">11-inch tablet</option>
                  <option value="tablet-13">13-inch tablet</option>
                </select>
                <small id="screen-profile-hint">Approximate physical size · Choose manually if Auto feels wrong</small>
              </label>
            </div>
          </fieldset>
          <fieldset class="settings-group lighting-group">
            <legend>Lighting</legend>
            <div class="group-controls">
              <label for="light-distance-input">
                <span>Light distance <output id="light-distance-value" for="light-distance-input">25 cm</output></span>
                <input id="light-distance-input" type="range" min="5" max="300" step="1" value="25" aria-describedby="light-distance-hint">
                <small id="light-distance-hint">Fixed out from the initial phone position · Recenter places it again</small>
              </label>
              <label for="light-elevation-input">
                <span>Light elevation <output id="light-elevation-value" for="light-elevation-input">7°</output></span>
                <input id="light-elevation-input" type="range" min="0" max="80" step="1" value="7" aria-describedby="light-elevation-hint">
                <small id="light-elevation-hint">Angle above the initial screen normal · Defaults: 3° Tilt, 7° stationary</small>
              </label>
              <label for="light-azimuth-input">
                <span>Light horizontal angle <output id="light-azimuth-value" for="light-azimuth-input">8° left</output></span>
                <input id="light-azimuth-input" type="range" min="-60" max="60" step="1" value="-8" aria-describedby="light-azimuth-hint">
                <small id="light-azimuth-hint">Lamp left or right of the initial screen normal · Stays fixed as the phone turns</small>
              </label>
              <label for="softness-input">
                <span>Shadow softness <output id="softness-value" for="softness-input">18%</output></span>
                <input id="softness-input" type="range" min="0" max="100" step="1" value="18" aria-describedby="softness-hint">
                <small id="softness-hint">Crisp edges to diffuse shadows</small>
              </label>
              <label for="rim-softness-input">
                <span>Rim shadow softness <output id="rim-softness-value" for="rim-softness-input">100%</output></span>
                <input id="rim-softness-input" type="range" min="0" max="100" step="1" value="100" aria-describedby="rim-softness-hint">
                <small id="rim-softness-hint">Rim shadow only · Independent of gameplay shadows</small>
              </label>
              <label class="lighting-toggle" for="diorama-input"><input id="diorama-input" type="checkbox" checked>Rim shadow</label>
            </div>
          </fieldset>
        </div>
        <footer class="settings-footer" aria-label="2.5D settings actions">
          <button id="reset-effects-settings-button" type="button" aria-label="Reset 2.5D settings to defaults" title="Restore every 2.5D setting to its default">Reset defaults</button>
        </footer>
      </section>

      <footer class="play-hint"><span>Controls</span> WASD / arrows · J K or Z X · Shift + Enter · R rewind · M mute · V layers</footer>
    </main>
    <script type="module" src="app.js?v=89"></script>
  </body>
</html>
